[bot]
# <героку-вар>
owner = 0
# <героку-вар>
token = ""
version = "1.0"
version_codename = "Ночной город Самурай"

[locale]
# локаль по умолчанию для сообщений бота
default = "ru"

# доступные локали (должна иметь соответствующую папку в locales/)
available = ["ru", "en"]

[groups]
# список основных идентификаторов чатов, где работает бот (может быть несколько)
main = []

# один канал для отчетов администратора
reports = 0

# один канал для логов
logs = 0

# list of linked channels (for auto-forward/comment detection)
linked_channels = []

# время в секундах для ограничения мультимедиа для новых пользователей
new_users_nomedia = 7776000

[spam]
# после какого количества сообщений антиспам перестанет проверять этого пользователя
member_messages_threshold = 10

# ИЛИ после какого количества очков репутации антиспам перестанет проверять этого пользователя
member_reputation_threshold = 10

# очки репутации, которые должен иметь пользователь, чтобы ему было разрешено отправлять сообщения типа мультимедиа
allow_media_threshold = 20

# удалять сообщения в течение этого интервала после публикации сообщения на канале (любой другой пол/неизвестно)
# установите значение 0, чтобы разрешить все
remove_first_comments_interval = 30

# Чтобы иметь возможность публиковать сообщения, необходимо иметь учетную запись с очками репутации (automatic_forward)
allow_comments_rep_threshold = 50

# удалять сообщения в течение этого интервала после публикации сообщения на канале (применяется только для женского пола)
# установите значение 0, чтобы разрешить все
women_remove_first_comments_interval = 600

# Очки репутации должны быть у женских учетных записей, чтобы иметь возможность публиковать сообщения
# может быть ниже для тех групп, где женщины оставляют комментарии не так часто
# влияет на то, будет ли фотография профиля проверяться на наличие NSFW
allow_comments_rep_threshold__woman = 10

# очки репутации, необходимые для пересылки сообщений от других чатов/пользователей
# Переадресация пользователей с низкой репутацией — распространенный шаблон спама.
allow_forwards_threshold = 50

# Штраф за репутацию за попытку пересылки с низкой репутацией
forward_violation_penalty = 10

# автоматически блокировать пользователей, которые превышают порог нарушений спама
autoban_enabled = true

# сколько нарушений необходимо для автобана участника (это только спам-нарушения)
autoban_threshold = 100

# только автоматический бан, если репутация участника ниже этого порога
autoban_rep_threshold = 100

# учетные записи с представителем Rep >allow_comments_rep_threshold__ Woman будут пропущены из проверок nsfw
# обратите внимание, что проверки NSFW выполняются только с женскими учетными записями с низкой репутацией.
[nsfw]
enabled = true

# >будет распознан как nsfw
# эти ценности действуют через условие И между чувственным и порнографией
comb_sensual_prediction_threshold = 0.15
comb_pornography_prediction_threshold = 0.15

# >будет распознан как nsfw
sensual_prediction_threshold = 0.8

# >будет распознан как nsfw
pornography_prediction_threshold = 0.3

# >будет распознан как nsfw
hentai_prediction_threshold = 0.5

# > НЕ будет определяться как nsfw
# these values works as: normal and (comb_sensual and comb_pornography)
normal_prediction_threshold = 0.3
normal_comb_sensual_prediction_threshold = 0.5
normal_comb_pornography_prediction_threshold = 0.2

# > НЕ будет определяться как nsfw
anime_prediction_threshold = 0.7

[db]
url = "sqlite+aiosqlite:///db.sqlite"

[cache]
# Кэш данных участника
members_maxsize = 500
members_ttl = 150  # seconds

# Кэш участников Telegram (статус администратора и т. д.)
tgmembers_maxsize = 1000
tgmembers_ttl = 600  # seconds

# Кэш определения пола (LRU, без TTL — имена не меняются)
gender_maxsize = 300

# Кэш обнаружения NSFW
nsfw_maxsize = 100
nsfw_ttl = 3600  # секунды (1 час)

# Как часто сбрасывать ожидающие обновления БД
batch_flush_interval = 60  # seconds

# Пропускайте дорогостоящие проверки ML для пользователей с таким количеством сообщений
trusted_user_messages = 100

[throttling]
# ограничение скорости для приватных чатов
enabled = true

# минимум секунд между сообщениями
rate_limit = 0.5

# максимальное количество сообщений, разрешенных во временном окне
max_messages = 20

# временное окно в секундах
time_window = 60

[healthcheck]
# Конечная точка проверки работоспособности HTTP для оркестрации контейнеров
enabled = false
host = "0.0.0.0"
port = 8080

[announcements]
# Включить/отключить запланированные объявления
enabled = true

# Отслеживайте последние N сообщений в каждой группе, чтобы проверить частоту объявлений.
history_size = 20

# Не отправлять новое объявление, если >= многие последние сообщения были объявлениями
# (защита стека пустых объявлений чата)
max_stack = 3

# Не отправлять повторно одно и то же объявление, если оно появлялось в последних N сообщениях.
avoid_duplicate_in_last = 15

# Глобальное время сна — не отправлять объявления в этот период.
# Формат: «ЧЧ:ММ» (24 часа), оставьте пустым, чтобы отключить
sleep_from = "22:00"
sleep_to = "9:00"

# UTC offset for sleep time calculation (e.g., 5 for UTC+5, -3 for UTC-3)
# 0 для времени сервера по умолчанию
utc_offset = 5

# Переопределения для каждой группы (необязательно)
# Настройки, специфичные для группы, имеют приоритет над глобальными настройками.
# Мы можем использовать это, например, чтобы объявления «спали» в разных часовых поясах.
# Может быть полезно, если бот используется в режиме мультичата с группами со всего мира.
# [объявления.группы.-1001234567890]
# Sleep_from = "23:00"
# Sleep_to = "08:00"
# utc_offset = 5

[ml]
# Автоматическая выгрузка моделей ML, когда они не используются, для экономии оперативной памяти.
auto_unload_enabled = true

# Выгрузить модель спама после стольких минут бездействия
spam_ttl_minutes = 60

# Выгрузить модель NSFW после стольких минут бездействия.
nsfw_ttl_minutes = 10

# How often to check for models to unload (seconds)
check_interval_seconds = 60